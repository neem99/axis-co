{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Axis & Co.{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/styles.css'%}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header class="site-header">
       <button class="menu-button" aria-label="Open navigation" onclick="toggleMenu(event)">
            ☰
        </button>

        <nav class = "nav-menu"  id="navMenu">
            <a href = "{% url 'home' %}">Home</a>
            <a href = "{% url 'portfolio_home' %}">Portfolio</a>
<!--            <a href = "{% url 'home' %}">About Us</a>-->
<!--            <a href = "{% url 'home' %}">Testimonials</a>-->
        </nav>

        <a href="{% url 'home' %}" class="brand-link">
            <img
                src="{% static 'images/A&co.jpg' %}"
                alt="Axis & Co."
                class="header-logo"
            >
        </a>

        <a href="{% url 'book' %}" class="book-now">
            BOOK NOW
        </a>

    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <script>
    // 1. Toggle the menu when clicking the hamburger button
    function toggleMenu(event) {
        // Prevent this click from immediately triggering the window click listener below
        if (event) event.stopPropagation();

        const menu = document.getElementById('navMenu');
        menu.classList.toggle('active');
    }

    // 2. Listen for clicks anywhere on the entire page
    window.addEventListener('click', function(event) {
        const menu = document.getElementById('navMenu');
        const menuButton = document.querySelector('.menu-button');

        // Check if the menu is open AND the user clicked outside the menu and the button
        if (menu.classList.contains('active') &&
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)) {

            menu.classList.remove('active'); // Close the menu smoothly
        }
    });
    </script>


</body>
</html>
